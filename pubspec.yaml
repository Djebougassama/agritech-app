name: agri_tech_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_fonts: ^6.2.1
  geolocator: ^10.0.0
  http: 1.3.0
  image_picker: ^0.8.7+4
  flutter_animate: ^4.1.1
  firebase_storage: ^12.4.4
  lucide_icons: ^0.257.0
  syncfusion_flutter_charts: ^20.4.48
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.12
  intl: ^0.19.0
  provider: ^6.0.5
  shimmer: ^3.0.0
  cloudinary_flutter: ^1.3.0
  cloudinary_public: ^0.23.1
  flutter_svg: ^2.0.17
  fl_chart: ^0.70.2
  youtube_player_flutter: ^9.1.1
  webview_flutter: ^4.10.0
  flutter_inappwebview: ^6.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  open_file: ^3.5.10
  shared_preferences: ^2.5.3

  flutter_localizations:
    sdk: flutter
  change_app_package_name: ^1.5.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0
  table_calendar: ^3.1.3
  badges: ^3.1.2
  connectivity_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.0
  build_runner: ^2.1.7
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # 👈 Ajout du package ici

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

flutter_launcher_icons:  # 👈 Configuration pour l'icône
  android: true
  ios: true
  image_path: "assets/icon/icon.png"  # 👈 Ton icône ici (assure-toi qu’elle existe bien)
  min_sdk_android: 21
